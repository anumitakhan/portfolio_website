<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h1 align="center">Student Registration Form</h1>
    <hr>

    <form>

        <fieldset>
            <legend><b>Personal Details</b></legend>

            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your full name"><br><br>

            <label>Father's Name:</label><br>
            <input type="text"><br><br>

            <label>Mother's Name:</label><br>
            <input type="text"><br><br>

            <label>Date of Birth:</label><br>
            <input type="date"><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Contact Details</b></legend>

            <label>Email:</label><br>
            <input type="email"><br><br>

            <label>Phone Number:</label><br>
            <input type="tel"><br><br>

            <label>Address:</label><br>
            <textarea rows="4" cols="30"></textarea><br><br>

            <label>City:</label><br>
            <input type="text"><br><br>

            <label>State:</label><br>
            <input type="text"><br><br>

            <label>PIN Code:</label><br>
            <input type="number"><br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Academic Details</b></legend>

            <label>Department:</label><br>
            <select>
                <option>Select Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>
            <br><br>

            <label>Semester:</label><br>
            <select>
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
                <option>7th Semester</option>
                <option>8th Semester</option>
            </select>

            <br><br>

            <label>Skills:</label><br>

            <input type="checkbox"> HTML<br>
            <input type="checkbox"> CSS<br>
            <input type="checkbox"> JavaScript<br>
            <input type="checkbox"> Java<br>
            <input type="checkbox"> Python<br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Other Details</b></legend>

            <label>Hobbies:</label><br>
            <input type="text"><br><br>

            <label>Create Password:</label><br>
            <input type="password"><br><br>

            <label>Upload Photo:</label><br>
            <input type="file"><br><br>

        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
